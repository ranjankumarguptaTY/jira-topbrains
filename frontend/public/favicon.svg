<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tbGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="50%" stop-color="#2684FF"/>
      <stop offset="100%" stop-color="#6554C0"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B8D9"/>
      <stop offset="100%" stop-color="#36B37E"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#tbGradient)"/>
  
  <!-- Neural / Agile Node Shapes -->
  <!-- Left Lobe / Kanban Bar -->
  <rect x="14" y="16" width="10" height="32" rx="5" fill="#FFFFFF" fill-opacity="0.95"/>
  
  <!-- Middle Kanban Bar with Brain Curve -->
  <rect x="27" y="12" width="10" height="40" rx="5" fill="#FFFFFF"/>
  
  <!-- Right Lobe / Agile Node -->
  <rect x="40" y="20" width="10" height="28" rx="5" fill="#FFFFFF" fill-opacity="0.9"/>
  
  <!-- Synapse Connectors -->
  <circle cx="19" cy="22" r="2.5" fill="#0052CC"/>
  <circle cx="32" cy="18" r="2.5" fill="#2684FF"/>
  <circle cx="45" cy="26" r="2.5" fill="#6554C0"/>
  <circle cx="32" cy="38" r="3" fill="url(#accentGradient)"/>
</svg>